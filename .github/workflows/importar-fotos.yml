name: Importar fotos de la web antigua

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/importar-fotos.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -m "Fotos importadas de la web antigua" || echo "Sin cambios"
          git push
