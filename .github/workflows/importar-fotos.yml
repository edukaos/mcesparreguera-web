name: Importar fotos de la web antigua

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "id de un solo coche (vacío = todos)"
        required: false
        default: ""
      fotos:
        description: "enlaces directos de fotos, separados por espacios (opcional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/importar-fotos.mjs
        env:
          SOLO: ${{ inputs.solo }}
          FOTOS: ${{ inputs.fotos }}
      # Reduce las fotos a 1600 px para que la web cargue rápido
      - run: |
          pip install --quiet pillow
          python3 -c "
          import glob
          from PIL import Image, ImageOps
          for f in glob.glob('fotos/' + ('${{ inputs.solo }}' or '*') + '/*.jpg'):
              im = ImageOps.exif_transpose(Image.open(f)).convert('RGB')
              im.thumbnail((1600, 1600))
              im.save(f, quality=80, optimize=True, progressive=True)
          "
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -m "Fotos importadas de la web antigua" || echo "Sin cambios"
          git push
