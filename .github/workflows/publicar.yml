name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # cada hora: recoge los cambios de la Google Sheet
  workflow_dispatch: {}  # botón "Run workflow" para publicar al momento

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fotos WebP ya generadas en builds anteriores (así el build horario tarda segundos)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ hashFiles('fotos/**') }}-${{ github.run_id }}
          restore-keys: img-
      - id: pages
        uses: actions/configure-pages@v5
      - run: node build.mjs
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
