name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # cada hora: recoge los cambios de la Google Sheet
  workflow_dispatch: {}  # botón "Run workflow" para publicar al momento

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
